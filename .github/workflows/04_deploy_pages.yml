name: Deploy Dashboard to GitHub Pages

on:
  workflow_run:
    workflows: ["2. Execute Pipeline (Step 1 & 2)"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'data/processed/full_batch_report.json'
      - 'data/processed/uplift_report.json'
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare Dashboard Build
        run: |
          mkdir _site
          cp -r dashboard/* _site/
          mkdir -p _site/data
          cp data/processed/full_batch_report.json _site/data/full_batch_report.json
          if [ -f data/processed/uplift_report.json ]; then
            cp data/processed/uplift_report.json _site/data/uplift_report.json
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
