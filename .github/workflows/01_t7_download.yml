name: "1. T7 Download (Initialization)"
on:
  workflow_dispatch:
  schedule:
    # Sundays 22:00 UTC (23:00 CET / 00:00 CEST), so the refreshed list is committed
    # before the daily pipeline starts on Monday at 01:00 UTC
    - cron: '0 22 * * 0'

permissions:
  contents: write

jobs:
  t7-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Run T7 Extraction
        run: uv run --locked python scripts/01_run_t7.py

      - name: Commit and Push T7 Dump and Qualified Tickers
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state/qualified_tickers.csv data/raw/t7-xetr-allTradableInstruments.csv
          git commit -m "chore: Auto-update T7 dump and qualified tickers" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

  notify:
    needs: [t7-download]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on Success
        if: ${{ needs.t7-download.result == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '@${{ github.repository_owner }} Workflow **${{ github.workflow }}** completed successfully! See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })

      - name: Notify on Failure
        if: ${{ needs.t7-download.result == 'failure' || needs.t7-download.result == 'cancelled' }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '@${{ github.repository_owner }} Workflow **${{ github.workflow }}** failed! See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
