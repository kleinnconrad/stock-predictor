# Target definition: UP if the close rises by at least `threshold` within `horizon_days` trading days
horizon_days: 126
threshold: 0.10

# Step 1 model
features_to_select: 12        # features kept by the Sequential Feature Selector
anova_k: 40                   # features kept by the ANOVA pre-filter before SFS
step1_history_years: 10       # training window of the Step 1 model
feature_warmup_years: 2       # extra history fetched so rolling features (up to 504 days) are populated from the first training day
quantiles: 10                 # bins of the lift chart
min_cv_accuracy: 0.65

# Calendar days between a FRED observation date and its (conservative) publication date
fred_publication_lag_days:
  daily: 1
  weekly: 7
  monthly: 60
  quarterly: 150

# Step 2 ruleset
min_step2_score: 7

xetra_t7_url: "https://www.cashmarket.deutsche-boerse.com/resource/blob/1528/6249e15bf93885fd91bd411663a0ff82/data/t7-xetr-allTradableInstruments.csv"
